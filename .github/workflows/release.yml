name: release

# A `v*` tag publishes everything (docs/progress/T4.2.md): the GitHub release with the homed archives, checksums.txt
# and the ChatGPT Site bundle, the Homebrew formula (Formula/homie.rb, committed to main) and the multi-arch image
# ghcr.io/devxpro/homie. Nothing here needs a personal access token.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # the release, its assets and the Formula/ commit
  packages: write  # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: GoReleaser derives the version from the tag and builds the changelog from commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # setup-go v6 installs the go.mod toolchain directive (a patched go1.26.x), not the bare go line.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Node serves both builds: the admin SPA (`make web`, a GoReleaser before hook) and the Site bundle below.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json

      # The ChatGPT Site bundle, packed like site/release/release.mjs does: the contents of dist/ (the build writes
      # dist/.openai/hosting.json itself) in a tar.gz whose root is dist/. GoReleaser uploads it as
      # homie-site_<version>.tar.gz and lists it in checksums.txt. bin/ is gitignored.
      - name: Build the Site bundle
        run: |
          npm --prefix site ci --no-audit --no-fund
          npm --prefix site run check
          npm --prefix site run build
          mkdir -p bin
          tar -C site -czf bin/homie-site.tar.gz dist
          tar -tzf bin/homie-site.tar.gz | grep -qx 'dist/.openai/hosting.json'
          tar -tzf bin/homie-site.tar.gz | grep -qx 'dist/server/index.js'

      # The image only copies the binaries GoReleaser built; qemu is for any RUN step of the Dockerfile on arm.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.20"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
