name: release

# A `v*` tag publishes everything: the GitHub release with the homed archives and checksums.txt, the Homebrew formula
# (Formula/homie.rb, committed to main; it depends on cloudflared) and the multi-arch image ghcr.io/devxpro/homie (with
# the pinned cloudflared inside). Nothing here needs a personal access token.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # the release, its assets and the Formula/ commit
  packages: write  # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: GoReleaser derives the version from the tag and builds the changelog from commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # setup-go v6 installs the go.mod toolchain directive (a patched go1.26.x), not the bare go line.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Node builds the admin SPA (`make web`, a GoReleaser before hook).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The image copies the binaries GoReleaser built and the pinned cloudflared; qemu is for the RUN steps of the
      # Dockerfile on arm.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.20"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
