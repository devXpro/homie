name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-go v6 installs the go.mod toolchain directive (a patched go1.26.x), not the bare go line.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - run: go test -race ./...

  # Known vulnerabilities reachable from our code, in the standard library of the toolchain above and in every module.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go version
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect web/
        id: detect
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
      - if: steps.detect.outputs.present == 'true'
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web run build

  # Nothing private in a public repo: local paths, private LAN addresses and real MAC addresses (the generic patterns
  # only; the list of names and domains is kept out of the repository).
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make privacy

  # The plugin template is a module of its own (templates/plugin/go.mod), outside ./... of the jobs above.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: templates/plugin/go.mod
          cache-dependency-path: templates/plugin/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: templates/plugin
      - run: go test -race ./...
        working-directory: templates/plugin

  # install/home.sh in Debian containers on both CPUs, also with systemd as PID 1 (docs/TESTING.md, "Home installers").
  # cloudflared is a fake there. The lint step also checks the pinned cloudflared version and checksums against the
  # release metadata published on GitHub and Docker Hub.
  installers-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.runner == 'ubuntu-latest'
        run: install/test/run.sh lint
        env:
          PINS_ONLINE: "1"
          GITHUB_TOKEN: ${{ github.token }}
      - run: install/test/run.sh linux
        env:
          PLATFORMS: native
          SYSTEMD_PLATFORMS: native

  # install/home.sh on macOS: files in a temp HOME, a fake brew and a fake launchctl, then real launchd under a test
  # label.
  installers-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: install/test/run.sh mac
