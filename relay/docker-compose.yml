# Homie relay, standalone: Caddy owns 80/443 and terminates TLS, frps stays
# internal. Written to the install dir by install/server.sh.
name: homie-relay

services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: homie-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frps

  frps:
    image: ghcr.io/fatedier/frps:v0.72.0
    container_name: homie-frps
    restart: unless-stopped
    command: ["-c", "/etc/frp/frps.toml"]
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
      - ./token:/etc/frp/token:ro
      - ./offline.html:/etc/frp/offline.html:ro

volumes:
  caddy_data:
  caddy_config:
