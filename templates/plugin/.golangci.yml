version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    presets:
      - std-error-handling
    rules:
      # internal/hub/hub.go holds the hub's shared types; some exported members are self-explanatory and uncommented.
      - path: internal/hub/hub\.go
        linters:
          - revive
        text: "exported"
formatters:
  enable:
    - gofmt
    - goimports
